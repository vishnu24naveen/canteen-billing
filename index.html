<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Canteen Billing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: monospace;
      margin: 0;
      padding: 10px;
      max-width: 100%;
      overflow-x: hidden;
    }
    .header { text-align: center; }
    .info input {
      width: 100%;
      margin: 6px 0;
      padding: 8px;
      font-size: 16px;
    }
    table {
      width: 100%;
      font-size: 13px;
      border-collapse: collapse;
    }
    th, td {
      border-bottom: 1px dashed black;
      padding: 5px;
    }
    th { text-align: left; font-weight: bold; }
    .qty-btn { padding: 4px 8px; font-size: 14px; }
    .total {
      text-align: right;
      font-weight: bold;
      margin-top: 10px;
      font-size: 18px;
    }
    button.print {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
    }
    input[type="text"] { width: 100%; font-size: 12px; }
    @media print {
      body { width: 80mm; }
      button { display: none; }
      input { border: none; }
    }
  </style>
</head>

<body>

<div class="header">
  <h2>CANTEEN</h2>
  <div id="dateTime"></div>
  <hr>
</div>

<div class="info">
  <input type="text" placeholder="Customer Name">
  <input type="text" placeholder="Seat Number">
</div>

<hr>

<table>
  <thead>
    <tr>
      <th>Item</th>
      <th>Qty</th>
      <th>₹</th>
      <th>Total</th>
      <th>Notes</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<div class="total" id="total">Total: ₹0</div>

<button class="print" onclick="window.print()">Print Bill</button>

<div style="text-align:center; margin-top:10px;">
  Thank You! Visit Again
</div>

<script>
let products = [
  { name: "Beverages 30", price: 30 },
  { name: "Beverages 50", price: 50 },
  { name: "Beverages 70", price: 70 },
  { name: "Snacks 30", price: 30 },
  { name: "Snacks 40", price: 40 },
  { name: "Snacks 50", price: 50 },
  { name: "Snacks 80", price: 80 },
  { name: "Puffs", price: 30 },
  { name: "Ice Cream", price: 60 },
  { name: "Waffers", price: 60 },
  { name: "Tea / Coffee", price: 30 },
  { name: "Sweet Corn", price: 40 },
  { name: "French Fries", price: 60 },
  { name: "Cutlet", price: 60 },
  { name: "Popcorn", price: 70 },
  { name: "Chicken Nuggets", price: 100 },
  { name: "Smiley Fries", price: 60 },
  { name: "Chicken Pops", price: 100 },
  { name: "Veg Spring Roll", price: 100 },
  { name: "Chicken Spring Roll", price: 100 },
  { name: "Veg Fried Momos", price: 100 },
  { name: "Chicken Fried Momos", price: 100 }
];

let quantities = [];

function load() {
  let table = document.getElementById("tableBody");

  products.forEach((p, i) => {
    let row = table.insertRow();

    row.insertCell(0).innerText = p.name;

    row.insertCell(1).innerHTML = `
      <button class="qty-btn" onclick="decrease(${i})">-</button>
      <span id="qty${i}">0</span>
      <button class="qty-btn" onclick="increase(${i})">+</button>
    `;

    row.insertCell(2).innerText = p.price;
    row.cells[2].style.textAlign = "right";

    row.insertCell(3).innerText = "0";
    row.cells[3].style.textAlign = "right";

    row.insertCell(4).innerHTML = `<input type="text">`;
  });

  document.getElementById("dateTime").innerText =
    new Date().toLocaleString();
}

function increase(i) {
  quantities[i] = (quantities[i] || 0) + 1;
  document.getElementById("qty" + i).innerText = quantities[i];
  calc();
}

function decrease(i) {
  if (!quantities[i]) return;
  quantities[i]--;
  document.getElementById("qty" + i).innerText = quantities[i];
  calc();
}

function calc() {
  let table = document.getElementById("tableBody");
  let total = 0;

  for (let i = 0; i < table.rows.length; i++) {
    let qty = quantities[i] || 0;
    let price = table.rows[i].cells[2].innerText;

    let t = qty * price;
    table.rows[i].cells[3].innerText = t;
    total += t;
  }

  document.getElementById("total").innerText = "Total: ₹" + total;
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

load();
</script>

</body>
</html>
