<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Canteen Billing</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: monospace;
  margin: 0;
  padding: 10px;
}

.header { text-align:center; }

.info input {
  width: 100%;
  margin: 5px 0;
  padding: 8px;
}

.item {
  border-bottom: 1px dashed black;
  padding: 5px 0;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.qty {
  display: flex;
  align-items: center;
}

.qty button {
  padding: 4px 8px;
}

.notes {
  width: 100%;
  margin-top: 4px;
}

.total {
  text-align: right;
  font-weight: bold;
  margin-top: 10px;
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="header">
  <h2>CANTEEN</h2>
  <div id="dateTime"></div>
  <hr>
</div>

<div class="info">
  <input type="text" id="customerName" placeholder="Customer Name">
  <input type="text" id="seatNumber" placeholder="Seat Number">
</div>

<hr>

<div id="list"></div>

<div class="total" id="total">Total: ₹0</div>

<button onclick="generateBill()">Generate Bill</button>

<script>
let products = [
  { name: "Beverages 30", price: 30 },
  { name: "Beverages 50", price: 50 },
  { name: "Beverages 70", price: 70 },
  { name: "Snacks 30", price: 30 },
  { name: "Snacks 40", price: 40 },
  { name: "Snacks 50", price: 50 },
  { name: "Snacks 80", price: 80 },
  { name: "Puffs", price: 30 },
  { name: "Ice Cream", price: 60 },
  { name: "Waffers", price: 60 },
  { name: "Tea / Coffee", price: 30 },
  { name: "Sweet Corn", price: 40 },
  { name: "French Fries", price: 60 },
  { name: "Cutlet", price: 60 },
  { name: "Popcorn", price: 70 },
  { name: "Chicken Nuggets", price: 100 },
  { name: "Smiley Fries", price: 60 },
  { name: "Chicken Pops", price: 100 },
  { name: "Veg Spring Roll", price: 100 },
  { name: "Chicken Spring Roll", price: 100 },
  { name: "Veg Fried Momos", price: 100 },
  { name: "Chicken Fried Momos", price: 100 }
];

let quantities = [];

function load() {
  let container = document.getElementById("list");

  products.forEach((p, i) => {
    let div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
      <div class="row">
        <span>${p.name}</span>

        <div class="qty">
          <button onclick="dec(${i})">-</button>
          <span id="q${i}" style="margin:0 5px">0</span>
          <button onclick="inc(${i})">+</button>
        </div>

        <span>₹${p.price}</span>
        <span id="t${i}">0</span>
      </div>

      <input class="notes" type="text" id="n${i}" placeholder="Notes (optional)">
    `;

    container.appendChild(div);
  });

  document.getElementById("dateTime").innerText =
    new Date().toLocaleString();
}

function inc(i) {
  quantities[i] = (quantities[i] || 0) + 1;
  document.getElementById("q" + i).innerText = quantities[i];
  calc();
}

function dec(i) {
  if (!quantities[i]) return;
  quantities[i]--;
  document.getElementById("q" + i).innerText = quantities[i];
  calc();
}

function calc() {
  let total = 0;

  products.forEach((p, i) => {
    let qty = quantities[i] || 0;
    let t = qty * p.price;

    document.getElementById("t" + i).innerText = t;
    total += t;
  });

  document.getElementById("total").innerText = "Total: ₹" + total;
}

function generateBill() {
  let name = document.getElementById("customerName").value || "-";
  let seat = document.getElementById("seatNumber").value || "-";

  let total = 0;

  let bill = `
    <div id="bill" style="
      width:100%;
      max-width:320px;
      margin:auto;
      font-family: monospace;
      padding:10px;
    ">

      <div style="text-align:center; font-weight:bold;">
        CANTEEN
      </div>

      <div style="font-size:12px; text-align:center;">
        ${new Date().toLocaleString()}
      </div>

      <hr>

      <div>Name: ${name}</div>
      <div>Seat: ${seat}</div>

      <hr>
  `;

  products.forEach((p, i) => {
    let qty = quantities[i] || 0;

    if (qty > 0) {
      let t = qty * p.price;
      let note = document.getElementById("n" + i).value;

      total += t;

      bill += `
        <div style="display:flex; justify-content:space-between;">
          <span>${p.name} x${qty}</span>
          <span>₹${t}</span>
        </div>

        ${note ? `
          <div style="font-size:12px; margin-left:10px;">
            • ${note}
          </div>
        ` : ""}
      `;
    }
  });

  bill += `
      <hr>

      <div style="display:flex; justify-content:space-between; font-weight:bold;">
        <span>Total</span>
        <span>₹${total}</span>
      </div>

      <div style="text-align:center; margin-top:10px;">
        Thank You! Visit Again
      </div>

    </div>
  `;

  // ✅ Replace entire screen with bill
  document.body.innerHTML = bill;

  // ✅ Auto trigger print/share
  setTimeout(() => {
    window.print();
  }, 300);
}
load();
</script>

</body>
</html>
